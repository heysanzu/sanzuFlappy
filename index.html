<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy</title>
    <link rel="icon" type="image/png" href="src/sanzu.png">
    <link rel="stylesheet" href="flappy.css">
</head>
<body>

    <div id="ui">
        <h1>Flappy</h1>
        <p class="hint">Tap, click, or press Space to flap</p>
        <p class="hint">Squeeze through the gaps - don't hit anything</p>
        <button id="start-btn">Start</button>
        <a class="gh-link" href="https://github.com/heysanzu" target="_blank" rel="noopener">GitHub ↗</a>
    </div>

    <div id="score-chip">0</div>

    <button id="mute-btn" title="Toggle sound">
        <img src="src/icons/unmute.png" alt="unmute" id="mute-icon">
    </button>

    <canvas id="game-canvas"></canvas>

    <script src="flappy/flappy.js"></script>
</body>
</html>
